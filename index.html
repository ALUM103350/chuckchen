<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4">
    <div class="bg-white p-4 rounded shadow"><canvas id="chart-USD_TWD"></canvas></div>
    <div class="bg-white p-4 rounded shadow"><canvas id="chart-USD_JPY"></canvas></div>
    <div class="bg-white p-4 rounded shadow"><canvas id="chart-Gold"></canvas></div>
    <div class="bg-white p-4 rounded shadow"><canvas id="chart-Oil"></canvas></div>
</div>

<script>
    fetch('history.json')
        .then(res => res.json())
        .then(history => {
            const labels = history.map(h => h.date);
            const keys = ["USD_TWD", "USD_JPY", "Gold", "Oil"];
            const colors = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444"];

            keys.forEach((key, index) => {
                const ctx = document.getElementById(`chart-${key}`).getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: `${key} 走勢`,
                            data: history.map(h => h.data[key]),
                            borderColor: colors[index],
                            fill: false,
                            tension: 0.3
                        }]
                    },
                    options: { responsive: true }
                });
            });
        });
</script>
