name: Update Exchange Rates
on:
  schedule:
    - cron: '0 * * * *' # 每小時跑一次
  workflow_dispatch:    # 讓你可以手動點擊執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v3

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安裝套件
        run: pip install requests yfinance

      - name: 執行抓取
        run: python chuck/2.exchange.py

      - name: 提交並推送更新
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # 同時追蹤 rates.json 和 history.json
          git add chuck/rates.json chuck/history.json
          git commit -m "Update finance data and history" || exit 0
          git push origin main